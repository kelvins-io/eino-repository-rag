openapi: 3.0.3
info:
  title: eino-repository-rag API
  version: "1.0.0"
  description: |
    `cmd/server` 暴露的 HTTP API，默认监听 `http://localhost:8090`（`configs/config.yaml` 的 `server.addr`）。

    除 `GET /health`、`POST /api/v1/auth/register`、`POST /api/v1/auth/login` 外，请求都需要 `Authorization: Bearer <JWT>`。
    用户与租户身份从 token 解析，请求体中的 `user_id` / `tenant_id` 会被忽略。

    成功响应 HTTP 200，JSON 为 `{ "code": 0, "message": "ok", "data": ... }`。
    失败响应的 HTTP 状态码与 body 中的 `code` 相同，且没有 `data`。

    权限：
    - 租户内知识库共享可读；更新、删除知识库以及更新、删除目录仅创建者可操作。同租户成员可建目录、导入文档。删除文档仅上传者可操作。
    - 租户管理员：当前租户用户名为 `admin`。可开关本租户用户登录，可为用户问题标注相关文档。
    - 平台管理员：租户 `default` 且用户名为 `admin`。可创建租户、查看租户列表、调整配额。`default` 租户不允许自助注册。

    `POST /api/v1/chat/agent` 仅在配置 `agent.enabled: true` 时注册。
    语音识别与合成未配置时，对应接口返回 503。
servers:
  - url: http://localhost:8090
    description: 本地默认地址
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 注册、登录与当前用户
  - name: Tenants
    description: 平台管理员的租户与配额
  - name: Users
    description: 本租户用户
  - name: KnowledgeBases
    description: 知识库
  - name: Directories
    description: 知识库目录树
  - name: Documents
    description: 文档导入、索引与召回
  - name: System
    description: 上传限额
  - name: Chat
    description: 问答、会话、语音与反馈
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HealthStatus"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册并签发 JWT
      description: 公开接口。`tenant_id` 为租户 code。`default` 租户返回 403。密码至少 6 个字符。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 当前租户不允许注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: 403
                message: 当前租户不允许注册新用户
        "409":
          description: 该租户下用户名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录并签发 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: 401
                message: 用户名或密码错误
        "403":
          description: 账号已被禁止登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: 403
                message: 该账号已被禁止登录
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: 当前登录用户
      description: 不重新签发 token。`data.token` 为空字符串，`data.expires_at` 为零值时间。
      responses:
        "200":
          $ref: "#/components/responses/AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: 创建租户
      description: 仅平台管理员。同时创建该租户的 `admin` 用户；初始密码只写日志，不出现在响应中。配额使用默认值 5。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTenantResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非平台管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: 403
                message: 仅 default 租户的 admin 可创建租户
        "409":
          description: 租户 ID 已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: 租户列表与用量
      description: 仅平台管理员。`page_size` 小于等于 0 或大于 100 时按 10 查询。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/tenants/limits:
    put:
      tags: [Tenants]
      operationId: updateTenantLimits
      summary: 调整租户配额
      description: 仅平台管理员。各项下限为 1。单文件大小还不能超过系统配置的上限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantLimitsRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TenantLimits"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 本租户用户列表
      description: "`page_size` 小于等于 0 或大于 100 时按 10 查询。用户名为 `admin` 的账号 `is_admin` 为 true。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users/login-enabled:
    put:
      tags: [Users]
      operationId: setUserLoginEnabled
      summary: 开关用户登录
      description: 仅租户管理员。不能关闭 `admin` 自己的登录权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLoginEnabledRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginEnabledResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非租户管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: 403
                message: 仅租户管理员可修改登录权限
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/knowledge-bases:
    post:
      tags: [KnowledgeBases]
      operationId: createKnowledgeBase
      summary: 创建知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseWrite"
      responses:
        "200":
          $ref: "#/components/responses/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [KnowledgeBases]
      operationId: listKnowledgeBases
      summary: 知识库列表
      description: 返回当前租户内的知识库。`page_size` 小于等于 0 或大于 100 时按 10 查询。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeBasePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/knowledge-bases/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [KnowledgeBases]
      operationId: getKnowledgeBase
      summary: 知识库详情
      responses:
        "200":
          $ref: "#/components/responses/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [KnowledgeBases]
      operationId: updateKnowledgeBase
      summary: 更新知识库
      description: 仅创建者。`name` 为空时保留原名称；`description` 会按请求体覆盖，省略等同于清空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseWrite"
      responses:
        "200":
          $ref: "#/components/responses/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [KnowledgeBases]
      operationId: deleteKnowledgeBase
      summary: 删除知识库
      description: 仅创建者。库下仍有文档或目录时返回 400。
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/knowledge-bases/{id}/directories:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Directories]
      operationId: createDirectory
      summary: 创建目录
      description: 同租户成员可在共享知识库下创建。省略 `parent_id` 表示根目录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/Directory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Directories]
      operationId: listDirectoryTree
      summary: 目录树
      responses:
        "200":
          description: 根节点数组，子目录在 `children` 中
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DirectoryNode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/directories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Directories]
      operationId: updateDirectory
      summary: 更新目录
      description: |
        仅所属知识库的创建者。`name` 为空时保留原名称。`description` 按请求体覆盖。
        省略 `parent_id` 不移动；`parent_id` 为 0 时移到根目录。省略 `sort_order` 不修改排序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDirectoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/Directory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Directories]
      operationId: deleteDirectory
      summary: 删除目录
      description: 仅所属知识库的创建者。目录下仍有文档或子目录时返回 400。
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/import:
    post:
      tags: [Documents]
      operationId: importDocument
      summary: 上传并导入文档
      description: |
        `multipart/form-data`。字段 `file` 与 `files` 都可重复，二者会合并。
        未传 `knowledge_base_id` 时归入当前用户的默认知识库。
        `title`、`source` 可重复，并与文件顺序对应。只传 1 个 `source` 时应用到全部文件；只传 1 个 `title` 且有多个文件时只作用于第一个文件。标题最长 256，来源最长 1024。
        同一知识库内按内容 MD5 去重，重复项 `duplicated=true` 且不触发索引。
        新文档状态为 `pending`，由索引队列异步变为 `indexing`，再变为 `ready` 或 `failed`。索引成功后删除本地文件。
        支持扩展名：`.pdf` `.docx` `.xlsx` `.pptx` `.html` `.htm` `.md` `.markdown` `.txt` `.csv` `.json` `.png` `.jpg` `.jpeg` `.webp` `.tif` `.tiff` `.bmp` `.gif`。
        单次文件数与单文件大小同时受 `rag.max_upload_*` 与租户配额约束。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  description: 上传文件，可重复
                  items:
                    type: string
                    format: binary
                files:
                  type: array
                  description: 与 `file` 等价，可重复
                  items:
                    type: string
                    format: binary
                title:
                  type: array
                  items:
                    type: string
                source:
                  type: array
                  description: 原文 URL
                  items:
                    type: string
                knowledge_base_id:
                  type: integer
                  format: int64
                directory_id:
                  type: integer
                  format: int64
      responses:
        "200":
          $ref: "#/components/responses/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/import-links:
    post:
      tags: [Documents]
      operationId: importDocumentLinks
      summary: 按链接导入文档
      description: |
        立即落库，由索引队列异步下载并建索引。单次条数与单文件大小上限与本地上传相同。
        支持两类链接：路径以允许扩展名结尾的 http(s) 直链（查询参数不参与类型判断）；有道云笔记公开分享链接。
        `source` 保存为提交的 URL。索引成功后本地副本会清理；重新索引时若本地文件已不在，会按 `source` 再次拉取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportLinksRequest"
      responses:
        "200":
          $ref: "#/components/responses/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/reindex:
    post:
      tags: [Documents]
      operationId: reindexDocuments
      summary: 重新索引
      description: |
        同租户可读即可触发。异步重建。不存在、正在 `indexing`、源文件已清理且 `source` 不能再次拉取、或请求内重复的 ID 会在结果中标记 `skipped=true`，不使整个请求失败。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdsRequest"
      responses:
        "200":
          description: 已处理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReindexResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/delete:
    post:
      tags: [Documents]
      operationId: deleteDocuments
      summary: 批量删除文档
      description: 仅上传者可删除。会清理向量分块、仍存在的本地文件和数据库记录。状态为 `indexing` 的文档会跳过。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdsRequest"
      responses:
        "200":
          description: 已处理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeleteDocumentsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: 文档列表
      description: "`page_size` 小于等于 0 或大于 100 时按 20 查询。`directory_id` 只匹配该目录，不含子目录。"
      parameters:
        - name: knowledge_base_id
          in: query
          schema:
            type: integer
            format: int64
        - name: directory_id
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          description: 默认 20，有效范围 1–100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DocumentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: 文档详情
      responses:
        "200":
          $ref: "#/components/responses/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: 删除文档
      description: 仅上传者。会清理向量分块、仍存在的本地文件和数据库记录。正在索引时返回 409。
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeletedDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/{id}/chunks:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: listDocumentChunks
      summary: 已索引分块
      description: 按 `chunk_index` 升序。未索引时 `data` 为空数组。
      responses:
        "200":
          description: 分块列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/IndexedChunk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/{id}/index-builds:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: listIndexBuilds
      summary: 索引构建历史
      description: 入队时创建一条记录，成功或放弃重试时写入结束时间。同一次任务的重试不另开记录。
      responses:
        "200":
          description: 构建记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list]
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/DocumentIndexBuild"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/documents/{id}/recall:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: documentRecall
      summary: 文档召回率
      description: |
        用已落库的检索记录和相关标注计算 Hit@K。没有相关标注时 `recall` 为 null。
        省略 `k` 时使用配置 `rag.top_k`（默认 5）。
      parameters:
        - name: k
          in: query
          description: TopK，必须大于 0
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 召回率
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DocumentRecall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/system/upload-limits:
    get:
      tags: [System]
      operationId: uploadLimits
      summary: 当前上传限额
      description: 单文件大小取系统配置与租户配额中更小的值。`max_upload_files` 是单次请求上限，`max_tenant_files` 是租户文件总数上限。
      responses:
        "200":
          description: 限额
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UploadLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/query:
    post:
      tags: [Chat]
      operationId: query
      summary: 知识库问答（SSE）
      description: |
        标准线性 RAG，带会话记忆。指定 `directory_id` 时包含该目录及其子目录。
        `session_id` 为空时服务端生成 UUID。同一 `session_id` 会带上短期与长期对话上下文。

        参数校验失败时返回 JSON 错误，不开启流。校验通过后响应为 `text/event-stream`，每条事件一行 `data: {json}`，以空行分隔。
        事件顺序：`meta`（session 与 sources）→ 若干 `delta` → `done`。生成过程中的失败以 `error` 事件返回，HTTP 状态仍为 200。

        示例：

        ```
        data: {"type":"meta","session_id":"s-demo-001","knowledge_base_id":1,"sources":[]}

        data: {"type":"delta","content":"从业"}

        data: {"type":"done","answer":"...","session_id":"s-demo-001","message_id":12,"user_message_id":11,"sources":[]}
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: SSE 事件流。参数校验失败时不开启流，返回 JSON 错误。
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 流式写出不受支持，或在写出 SSE 头之前失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/chat/agent:
    post:
      tags: [Chat]
      operationId: agentQuery
      summary: Agent 多步问答（SSE）
      description: |
        仅当 `agent.enabled` 为 true 时注册，否则路由不存在。
        请求体与 `/api/v1/chat/query` 相同。ReAct 多步检索，工具名为 `knowledge_retrieve`。
        事件顺序：`meta` → `step` / `tool_start` / `tool_result`（可多轮）→ `delta` → `done`。失败时为 `error` 事件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/quota:
    get:
      tags: [Chat]
      operationId: chatQuota
      summary: 今日问答与语音配额
      description: 按北京时间当天统计剩余新建会话、语音输入和文字转语音次数。
      responses:
        "200":
          description: 配额
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatQuota"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/transcribe:
    post:
      tags: [Chat]
      operationId: transcribeSpeech
      summary: 语音转文字
      description: |
        上传录音。支持扩展名 `.webm` `.ogg` `.oga` `.mp3` `.wav` `.m4a` `.mp4` `.mpeg` `.mpga` `.flac` `.aac`，或 `Content-Type` 以 `audio/` 开头。
        识别成功后计入租户当日语音输入次数。未启用时返回 503。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                  description: 可选，传给识别服务
                prompt:
                  type: string
                  description: 可选提示词
      responses:
        "200":
          description: 识别文本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [text]
                        properties:
                          text:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/speech:
    post:
      tags: [Chat]
      operationId: synthesizeSpeech
      summary: 文字转语音
      description: |
        成功时响应体是音频二进制，`Content-Type` 由合成服务决定，缺省为 `audio/mpeg`。不是 JSON 信封。
        合成成功后计入租户当日 TTS 次数。未启用时返回 503。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: 要朗读的文本，不能为空
      responses:
        "200":
          description: 音频二进制
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/history:
    get:
      tags: [Chat]
      operationId: history
      summary: 会话消息历史
      description: 长期记忆。助手消息可带 `vote` 与 `score`；用户消息可带 `relevant_doc_ids`。这些字段不进入模型上下文。
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/sessions:
    get:
      tags: [Chat]
      operationId: listSessions
      summary: 会话列表
      description: 按知识库筛选当前用户的会话。传入 `directory_id` 时只返回该目录下的会话。
      parameters:
        - name: knowledge_base_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: directory_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 会话数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/relevance:
    put:
      tags: [Chat]
      operationId: setRetrievalRelevance
      summary: 标注相关文档
      description: 仅租户管理员。为一条用户问题覆盖相关文档，作为该文档召回率的分母。`doc_ids` 传空数组表示清除。文档 ID 为十进制字符串。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRelevance"
      responses:
        "200":
          description: 当前标注
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RetrievalRelevance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 非租户管理员或无权访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/chat/feedback:
    put:
      tags: [Chat]
      operationId: setChatFeedback
      summary: 回答点赞或评分
      description: |
        评价一条助手回答。未提交的字段保持不变。`vote` 为空字符串表示取消点赞或点踩；`score` 为 0 表示取消评分。
        至少提供 `vote` 或 `score` 之一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFeedbackRequest"
      responses:
        "200":
          description: 当前反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChatFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "HS256 JWT。请求头 Authorization: Bearer <token>。"

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 页码，从 1 开始。小于等于 0 时按 1 查询。响应回显请求中的原始值。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数，有效范围 1–100，默认 10。超出范围时按 10 查询。响应回显请求中的原始值。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    AuthResult:
      description: 认证结果。注册与登录包含 token；`/auth/me` 的 token 为空。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
    KnowledgeBase:
      description: 知识库
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/KnowledgeBase"
    Directory:
      description: 目录
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Directory"
    Document:
      description: 文档
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Document"
    ImportResult:
      description: 导入结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportResult"
    Deleted:
      description: 已删除
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Deleted"
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未登录、token 无效，或登录状态已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            missing:
              value:
                code: 401
                message: 缺少 Authorization，请先登录
            invalid:
              value:
                code: 401
                message: 登录已失效，请重新登录
    Forbidden:
      description: 已登录但无权操作，或账号已被禁止登录
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            forbidden:
              value:
                code: 403
                message: 无权访问该资源
            loginDisabled:
              value:
                code: 403
                message: 该账号已被禁止登录
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 资源正在索引，拒绝删除
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooLarge:
      description: 请求体超过大小限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: 上游语音服务失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: 语音能力未启用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiSuccess:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
          description: 成功时固定为 0，与 HTTP 200 不同
        message:
          type: string
          example: ok
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 与 HTTP 状态码相同
        message:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: up
    Deleted:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          example: true
    DeletedDocument:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          example: true
        id:
          type: integer
          format: int64
    RegisterRequest:
      type: object
      required: [tenant_id, username, password]
      properties:
        tenant_id:
          type: string
          description: 租户 code
        username:
          type: string
        password:
          type: string
          minLength: 6
        display_name:
          type: string
          description: 省略时使用用户名
    LoginRequest:
      type: object
      required: [tenant_id, username, password]
      properties:
        tenant_id:
          type: string
          description: 租户 code
        username:
          type: string
        password:
          type: string
    AuthResult:
      type: object
      required: [token, expires_at, user, tenant]
      properties:
        token:
          type: string
          description: JWT。`GET /auth/me` 为空字符串
        expires_at:
          type: string
          format: date-time
          description: token 过期时间。`GET /auth/me` 为零值时间
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          $ref: "#/components/schemas/TenantView"
    AuthUser:
      type: object
      required: [id, username, display_name]
      properties:
        id:
