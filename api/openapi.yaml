    StreamEvent:
      type: object
      required: [type]
      description: |
        SSE 的 `data` JSON。`type` 决定哪些字段有值。
        `meta`：session_id、knowledge_base_id、directory_id；线性 RAG 还带 sources。
        `delta`：content 为增量文本。Agent 在结束后一次性推送完整回答。
        `done`：answer、sources、message_id（助手消息）、user_message_id。
        `error`：message。
        `step` / `tool_start` / `tool_result`：仅 Agent。
      properties:
        type:
          type: string
          enum: [meta, delta, done, error, step, tool_start, tool_result]
        content:
          type: string
        answer:
          type: string
        session_id:
          type: string
        knowledge_base_id:
          type: integer
          format: int64
        directory_id:
          type: integer
          format: int64
          nullable: true
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDocument"
        message_id:
          type: integer
          format: int64
          description: 助手消息 ID，出现在 done
        user_message_id:
          type: integer
          format: int64
          description: 用户消息 ID，出现在 done
        message:
          type: string
        step:
          type: integer
        tool:
          type: string
          example: knowledge_retrieve
        tool_query:
          type: string
        tool_count:
          type: integer
