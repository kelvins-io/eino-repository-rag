services:
  postgres:
    image: postgres:13
    container_name: eino-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123
      POSTGRES_DB: eino_rag
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d eino_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis：短期记忆始终需要；provider=redis 时同时作为向量库
  redis:
    image: redis/redis-stack-server:latest
    container_name: eino-rag-redis
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OCR sidecar：tesseract + pdftoppm。本地 go run 与 app 容器都通过 HTTP 调用，无需本机 brew。
  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    image: eino-repository-rag-ocr:latest
    container_name: eino-rag-ocr
    environment:
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
      OCR_MAX_PROCS: "1"
    cpus: 2.0
    mem_limit: 2g
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 本地 Milvus Standalone（Go SDK 可连；对应 vector_index.provider=milvus_lite）
  # 启动：docker compose --profile milvus up -d
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: eino-rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: eino-rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.5.4
    container_name: eino-rag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 应用服务：docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: eino-repository-rag:latest
    container_name: eino-rag-app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123
      POSTGRES_DB: eino_rag
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_ADDR: ":8080"
      # 默认 redis 向量库；Milvus：VECTOR_INDEX_PROVIDER=milvus_lite + --profile milvus
      VECTOR_INDEX_PROVIDER: ${VECTOR_INDEX_PROVIDER:-redis}
      MILVUS_ADDRESS: ${MILVUS_ADDRESS:-milvus:19530}
      OCR_ENDPOINT: http://ocr:8080
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 前端：nginx 静态资源 + 反代 /api、/health → app
  web:
    profiles: ["app"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: eino-repository-rag-web:latest
    container_name: eino-rag-web
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  etcddata:
  miniodata:
  milvusdata:
  uploads:
