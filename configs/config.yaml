server:
  addr: ":8080"
  mode: "debug"

log:
  level: "info"          # debug | info | warn | error
  encoding: "console"    # console | json
  rotate_daily: true     # 文件输出按本地日期轮转，例如 logs/app.log -> logs/app-2006-01-02.log
  max_age_days: 30       # 归档保留天数；负数表示不删除
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

jwt:
  secret: "eino-rag-dev-secret-change-me"  # 生产请用环境变量 JWT_SECRET 覆盖
  expire_hours: 1
  issuer: "eino-repository-rag"

postgres:
  host: "localhost"
  port: 15433
  user: "rag"
  password: "rag123"
  dbname: "eino_rag"
  sslmode: "disable"
  connect_timeout_seconds: 10

redis:
  addr: "localhost:16379"
  password: "123456"
  db: 0
  # 向量索引配置（provider=redis 时生效，需 Redis Stack / RediSearch）
  index_name: "kb_index"
  key_prefix: "kb:doc:"
  vector_field: "content_vector"
  vector_dim: 1024
  dial_timeout_seconds: 10
  read_timeout_seconds: 60
  write_timeout_seconds: 60

# 向量索引后端：redis | milvus_lite
vector_index:
  provider: "milvus_lite"

# provider=milvus_lite 时生效（连接本地 Milvus Lite/Standalone gRPC）
milvus:
  address: "localhost:19530"
  username: ""
  password: ""
  collection: "kb_docs"
  metric_type: "COSINE"
  dimension: 1024
  connect_timeout_seconds: 10

deepseek:
  api_key: ""
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  max_tokens: 2048
  temperature: 0.3
  timeout_seconds: 120   # 对话 / Agent / 流式生成 HTTP 超时

# DeepSeek 不提供 Embedding，使用 OpenAI 兼容接口（可用 OpenAI / SiliconFlow / 通义等）
# dimensions: 0/省略 = 不传给 API。SiliconFlow 对 BAAI/bge-m3 传 dimensions 会返回 20015；
# 向量库维度由 redis.vector_dim / milvus.dimension 控制（bge-m3 为 1024）。
embedding:
  api_key: ""
  model: "BAAI/bge-m3"
  base_url: "https://api.siliconflow.cn/v1"
  dimensions: 0
  timeout_seconds: 120
  batch_size: 16          # SiliconFlow 对大批量 embeddings 易超时，客户端拆批
  max_retries: 2          # 超时 / 429 / 5xx 重试（不含首次）
  max_concurrency: 2      # 全局并发请求数，避免多 worker 同时打满 API

rag:
  chunk_size: 800
  overlap_size: 100
  top_k: 5
  # Hybrid：稠密向量 + Redis BM25，经 RRF 融合；milvus 模式会额外维护 BM25 sidecar
  hybrid_enabled: true
  candidate_k: 20
  rrf_k: 60
  bm25_index_name: "kb_bm25_index"
  bm25_key_prefix: "kb:bm25:"
  upload_dir: "./storage/uploads"
  # 单文件大小上限（MB）；单次导入最多文件数（nginx client_max_body_size 需 ≥ 二者乘积）
  max_upload_file_size_mb: 50
  max_upload_files: 5
  # Redis 持久化索引队列
  index_workers: 3
  index_max_retries: 3
  index_job_timeout_minutes: 60
  index_retry_backoff_seconds: 5
  index_queue_key: "kb:index:queue"
  index_active_key: "kb:index:active"
  index_dlq_key: "kb:index:dlq"
  index_dedup_key: "kb:index:queued"
  # Query 改写 / 多路召回：LLM 生成 N 条改写，与原 query 分别检索后 RRF 融合
  query_expand_enabled: true
  query_expand_n: 2
  query_expand_timeout_seconds: 20
  # 结构切分：PDF/PPTX 按页、XLSX 按工作表、MD/HTML 按标题；超长段再 Recursive
  structure_split_enabled: true
  # 引用后校验：清洗越界 [n]；可选仅保留被引用的 sources
  citation_validate_enabled: true
  citation_filter_sources: false
  # 扫描 PDF / 图片 OCR：调用 compose ocr 服务（docker compose up -d ocr）
  ocr:
    enabled: true
    endpoint: "http://localhost:18080"
    languages: "chi_sim+eng"
    dpi: 200
    concurrency: 1
    timeout_seconds: 60
    page_seg_mode: 6

# Cross-Encoder 重排（OpenAI 兼容，如 SiliconFlow /v1/rerank）
# api_key / base_url 为空时回退 embedding 配置
rerank:
  enabled: true
  api_key: ""
  model: "BAAI/bge-reranker-v2-m3"
  base_url: "https://api.siliconflow.cn/v1"
  top_n: 5
  timeout_seconds: 60

# 语音输入：OpenAI 兼容 /audio/transcriptions（SiliconFlow SenseVoice）
# api_key / base_url 为空时回退 embedding 配置
asr:
  enabled: true
  api_key: ""
  model: "FunAudioLLM/SenseVoiceSmall"
  base_url: "https://api.siliconflow.cn/v1"
  language: "zh"
  prompt: "知识库问答"
  timeout_seconds: 60
  max_audio_mb: 8

# 问答朗读：OpenAI 兼容 /audio/speech（SiliconFlow CosyVoice）
# api_key / base_url 为空时回退 asr / embedding 配置
tts:
  enabled: true
  api_key: ""
  model: "FunAudioLLM/CosyVoice2-0.5B"
#  voice 可更换为 bella、alex、anna
  voice: "anna"
  base_url: "https://api.siliconflow.cn/v1"
  timeout_seconds: 60
  max_chars: 4000

memory:
  short_term_ttl_minutes: 60
  short_term_max_messages: 20
  long_term_max_messages: 50
  # 注入 prompt 的历史上下文 token 预算（摘要 + 最近原文）
  context_token_budget: 3000
  # 摘要时始终保留的最近原文条数
  keep_recent_messages: 6
  # 是否对超出窗口的历史做 LLM 滚动摘要
  summary_enabled: true
  # 活跃历史超过该条数时，将更早部分折叠进摘要
  summary_trigger_messages: 8
  summary_timeout_seconds: 30

# ReAct Agent：多步 knowledge_retrieve；enabled=false 时不注册 /chat/agent
agent:
  enabled: true
  max_steps: 4
  tool_top_k: 5
