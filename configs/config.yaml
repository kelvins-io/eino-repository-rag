server:
  addr: ":8080"
  mode: "debug"

postgres:
  host: "localhost"
  port: 15432
  user: "rag"
  password: "rag123"
  dbname: "eino_rag"
  sslmode: "disable"

redis:
  addr: "localhost:16379"
  password: "123456"
  db: 0
  # 向量索引配置（provider=redis 时生效，需 Redis Stack / RediSearch）
  index_name: "kb_index"
  key_prefix: "kb:doc:"
  vector_field: "content_vector"
  vector_dim: 1024

# 向量索引后端：redis | milvus_lite
vector_index:
  provider: "milvus_lite"

# provider=milvus_lite 时生效（连接本地 Milvus Lite/Standalone gRPC）
milvus:
  address: "localhost:19530"
  username: ""
  password: ""
  collection: "kb_docs"
  metric_type: "COSINE"
  dimension: 1024

deepseek:
  api_key: "sk-0961878b8a2c4154a1a3ba8e74ccb863"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  max_tokens: 2048
  temperature: 0.3

# DeepSeek 不提供 Embedding，使用 OpenAI 兼容接口（可用 OpenAI / SiliconFlow / 通义等）
# dimensions: 0/省略 = 不传给 API。SiliconFlow 对 BAAI/bge-m3 传 dimensions 会返回 20015；
# 向量库维度由 redis.vector_dim / milvus.dimension 控制（bge-m3 为 1024）。
embedding:
  api_key: "sk-xrrujhahkdutenptifywzwxsajvnextgeowivfefpaiibgjg"
  model: "BAAI/bge-m3"
  base_url: "https://api.siliconflow.cn/v1"
  dimensions: 0

rag:
  chunk_size: 800
  overlap_size: 100
  top_k: 5
  # Hybrid：稠密向量 + Redis BM25，经 RRF 融合；milvus 模式会额外维护 BM25 sidecar
  hybrid_enabled: true
  candidate_k: 20
  rrf_k: 60
  bm25_index_name: "kb_bm25_index"
  bm25_key_prefix: "kb:bm25:"
  upload_dir: "./storage/uploads"

# Cross-Encoder 重排（OpenAI 兼容，如 SiliconFlow /v1/rerank）
# api_key / base_url 为空时回退 embedding 配置
rerank:
  enabled: true
  api_key: ""
  model: "BAAI/bge-reranker-v2-m3"
  base_url: "https://api.siliconflow.cn/v1"
  top_n: 5
  timeout_seconds: 30

memory:
  short_term_ttl_minutes: 60
  short_term_max_messages: 20
  long_term_max_messages: 50
  # 注入 prompt 的历史上下文 token 预算（摘要 + 最近原文）
  context_token_budget: 3000
  # 摘要时始终保留的最近原文条数
  keep_recent_messages: 6
  # 是否对超出窗口的历史做 LLM 滚动摘要
  summary_enabled: true
  # 活跃历史超过该条数时，将更早部分折叠进摘要
  summary_trigger_messages: 8
